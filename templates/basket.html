{% extends "base.html" %}
{% block title %}Корзина{% endblock %}

{% block content %}
<div class="cart-container" style="max-width:900px;margin:0 auto;">
    <h2 style="text-align:center;color:var(--brand);margin-bottom:30px;">Корзина</h2>
    
    <div id="cartNotification" class="cart-notification" style="display:none;"></div>
    
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-summary">
        <div id="totalPrice" style="font-size:20px;font-weight:700;">Итого: 0 ₽</div>
        <button id="checkoutBtn" class="buy-btn">Оформить заказ</button>
    </div>
</div>

<div id="checkoutModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <button class="modal-close" id="modalClose">&times;</button>
        <h2>Подтверждение оплаты</h2>
        <div id="modalOrderList" class="modal-list"></div>
        <div class="modal-total">Итого: <span id="modalTotal">0 ₽</span></div>
        <div class="modal-actions">
            <button id="modalConfirm" class="save-btn">Подтвердить</button>
            <button id="modalCancel" class="back-btn">Отменить</button>
        </div>
    </div>
</div>
{% endblock %}
