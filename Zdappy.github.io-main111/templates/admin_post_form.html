{% extends "base.html" %}
{% block content %}
<div class="form-container" style="max-width: 800px; margin: 0 auto; padding: 20px;">
    <h2>{{ title }}</h2>
    
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div style="margin-bottom: 15px;">
            <label>Заголовок статьи:</label>
            <input type="text" name="title" value="{{ post.title if post else '' }}" required class="search-input" style="width: 100%;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Ссылка на изображение:</label>
            <input type="text" name="image_post" value="{{ post.image_post if post else '' }}" class="search-input" style="width: 100%;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Текст статьи:</label>
            <textarea name="content" required class="search-input" style="width: 100%; height: 300px; resize: vertical;">{{ post.content if post else '' }}</textarea>
        </div>

        <div style="display: flex; gap: 10px;">
            <button type="submit" class="search-btn" style="background: var(--brand); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
                Сохранить изменения
            </button>
            <a href="{{ url_for('main.admin') }}" class="top-link" style="text-decoration: none; padding: 10px 20px; border: 1px solid #ccc; border-radius: 5px; color: #666;">
                Отмена
            </a>
        </div>
    </form>
</div>
{% endblock %}
