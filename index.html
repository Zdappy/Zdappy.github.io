<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Новая Эра</title>
  <link rel="icon" href="images/icon.png" />
  <link href="css/style.css" rel="stylesheet" />
  <script src="js/Java.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
</head>
<body>

  <div class="modal-overlay hidden" id="overlay"></div>

  <div class="modal hidden" id="loginModal">
    <div class="modal-content">
      <h2>Вход</h2>
      <input type="text" id="emailInput" placeholder="Email" />
      <input type="password" id="passwordInput" placeholder="Пароль" />
      <div id="error-message" style="color: red; font-size: 14px;"></div>
      <button id="loginBtn">Войти</button>
      <button class="switch-btn" id="openRegister">Регистрация</button>
    </div>
  </div>

  <div class="modal hidden" id="registerModal">
    <div class="modal-content">
      <h2>Регистрация</h2>
      <input type="text" placeholder="�?мя" />
      <input type="text" placeholder="Email" />
      <input type="password" placeholder="Пароль" />
      <button>Зарегистрироваться</button>
      <button class="switch-btn" id="openLogin">У меня уже есть аккаунт</button>
    </div>
  </div>

  <header class="header">
    <div class="container header-top">
      <div class="logo">
        <img src="images/icon.png" alt="Логотип" />
        <span class="title">Новая Эра</span>
      </div>
      <div class="auth-links">
        <p class="entrance">Вход</p>
        <button id="themeToggle" class="switch-btn">🌙</button>
      </div>
    </div>

    <div class="container header-bottom">
      <div class="catalog-container">
        <button class="catalog-button">Каталог товаров ▼</button>
        <div class="catalog-menu">
          <ul>
            <li><a data-json="semenaO.json">Семена овощи</a></li>
            <li><a data-json="semenaC.json">Семена цветы</a></li>
            <li><a data-json="cvety.json">Рассада цветы</a></li>
            <li><a data-json="ovoshi.json">Рассада овощи</a></li>
            <li><a data-json="posadochny_material.json">Посадочный материал</a></li>
          </ul>
        </div>
      </div>

      <div class="search-cart">
        <form class="search-form" onsubmit="return false;">
          <input type="text" class="search-input" placeholder="Поиск товаров..." />
          <button type="submit" class="search-btn">Найти</button>
        </form>
        <div class="cart-wrapper">
            <a href="basket.html" class="cart-icon">🛒<span class="cart-count">0</span></a>
        </div>

      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="products-grid" id="productList"></div>
  </main>

  <footer class="footer">
    <p>&copy; 2025 Новая Эра. Все права защищены.</p>
  </footer>
</body>
</html>
